
name: Build and Deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/python:3.14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify Git LFS pointers
        run: |
          git ls-files | git check-attr --stdin filter | \
            awk -F': ' '$3 == "lfs" { print $1 }' | \
            xargs -r -L1 sh -c 'git cat-file blob "HEAD:$0" | \
              git lfs pointer --check --stdin || { echo "$0"; exit 1; }'

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-python3.14-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-python3.14-

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant python3-enchant
          pip3 install --user -r requirements.txt --upgrade
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build and check documentation
        run: |
          make dirhtml
          make spelling
          python3 utils/check-spelling-output.py docs/_build/spelling

      - name: Compress images
        run: pngquant docs/_build/dirhtml/_images/*.png --force --ext .png --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: |
            docs/_build/dirhtml/
            s3_website.yml
          if-no-files-found: error

  deploy:
    needs: build
    if: github.repository_owner == 'getodk' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: cimg/ruby:3.2
    environment: AWS
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: website

      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
          gem install s3_website_revived
          s3_website install

      - name: Deploy to S3
        run: s3_website push
